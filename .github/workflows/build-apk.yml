name: Build 1 Crore test APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK (preinstalled on runner)
        run: |
          SDK=/usr/local/lib/android/sdk
          echo "ANDROID_HOME=$SDK" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK" >> $GITHUB_ENV
          if [ -d "$SDK/cmdline-tools/latest" ]; then CT="$SDK/cmdline-tools/latest"; else CT=$(ls -d $SDK/cmdline-tools/*/ | sort -V | tail -n1); fi
          echo "Using cmdline-tools: $CT"
          yes | "$CT/bin/sdkmanager" --licenses || true
          "$CT/bin/sdkmanager" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Restore google-services.json from secret
        run: |
          echo "$GOOGLE_SERVICES_JSON_B64" | base64 -d > app/google-services.json
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON }}

      - name: Restore debug keystore from secret
        run: |
          echo -n "$KS1" | wc -c
          echo -n "$KS2" | wc -c
          echo -n "$KS3" | wc -c
          echo -n "$KS4" | wc -c
          echo -n "$KS5" | wc -c
          echo -n "$KS6" | wc -c
          echo -n "$KS7" | wc -c
          echo -n "$KS8" | wc -c
          echo "${KS1}${KS2}${KS3}${KS4}${KS5}${KS6}${KS7}${KS8}" | base64 -d > debug.keystore
          ls -la debug.keystore
        env:
          KS1: ${{ secrets.KS1 }}
          KS2: ${{ secrets.KS2 }}
          KS3: ${{ secrets.KS3 }}
          KS4: ${{ secrets.KS4 }}
          KS5: ${{ secrets.KS5 }}
          KS6: ${{ secrets.KS6 }}
          KS7: ${{ secrets.KS7 }}
          KS8: ${{ secrets.KS8 }}

      - name: Verify debug keystore
        run: keytool -list -keystore debug.keystore -storepass android -alias androiddebugkey

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "9.3.1"

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --console=plain --stacktrace

      - name: Rename to 1 Crore.apk
        run: cp app/build/outputs/apk/debug/app-debug.apk "1 Crore.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: 1-Crore-v1.2-test-apk
          path: "1 Crore.apk"
          if-no-files-found: error
