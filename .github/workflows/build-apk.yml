name: Build 1 Crore test APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK (preinstalled on runner)
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          yes | /usr/local/lib/android/sdk/cmdline-tools/16.0/bin/sdkmanager --licenses || true
          /usr/local/lib/android/sdk/cmdline-tools/16.0/bin/sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Restore google-services.json from secret
        run: |
          echo "$GOOGLE_SERVICES_JSON_B64" | base64 -d > app/google-services.json
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON }}

      - name: Restore debug keystore from secret
        run: |
          echo "$DEBUG_KEYSTORE_B64" | base64 -d > debug.keystore
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE }}

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "9.3.1"

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --console=plain --stacktrace

      - name: Rename to 1 Crore.apk
        run: cp app/build/outputs/apk/debug/app-debug.apk "1 Crore.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: 1-Crore-v1.2-test-apk
          path: "1 Crore.apk"
          if-no-files-found: error
